name = "examforge-api"
main = "worker.js"
compatibility_date = "2024-11-01"

# Cloudflare D1 Database binding
# Run: npx wrangler d1 create examforge-db
# Then replace the database_id below with your database id:
[[d1_databases]]
binding = "DB"
database_name = "examforge-db"
database_id = "examforge-db-id"

# Optional AI API Keys (can also be set in Cloudflare Dashboard -> Settings -> Variables)
# [vars]
# GEMINI_API_KEY = "your-gemini-key"
# GROQ_API_KEY = "your-groq-key"
